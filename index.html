<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DrinkMaster</title>
<meta name="description" content="DrinkMaster : collectionne des milliers de cartes de thés, sodas, alcools, eaux, cafés et boissons énergisantes, ouvre des packs, réponds au quiz de Fabien et retrouve Teapee le chat.">
<meta property="og:title" content="DrinkMaster"><meta property="og:description" content="Le jeu de cartes des boissons du monde.">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c4a38"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DrinkMaster"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fredoka:wght@400;500;600&family=Hanken+Grotesk:wght@400;500;700&family=Marcellus&family=Nunito:wght@400;600;700&display=swap">
<style>

/* Concept : un salon de thé. Les thèmes (JS) remplacent les jetons de couleur ; Fond vert encre, cartes en porcelaine, accent couleur de liqueur ambrée.
   Navigation basse sur téléphone, en-tête sur grand écran. Les cartes gardent leurs propres couleurs dans les deux thèmes. */
:root{
  --bg:#0e1814; --bg2:#13211b; --surface:#182a22; --surface2:#1f342a; --line:#2c453a;
  --fg:#e9f0ea; --muted:#9bb2a5; --accent:#e3a74f; --accent-ink:#1b1305; --jade:#58c49a; --danger:#e48a7a;
  --f-display:'Marcellus','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  --paper:#f3f5ef; --porc:#f9faf6; --cink:#15251d; --cmut:#5d6f64;
  --r0:#8d9a91; --r1:#3f9a76; --r2:#4a7cc9; --r3:#9a58c8; --r4:#d9a22f;
  --stage:#07110d; --stage2:#16352a; --stage-fg:#eaf2ec; --stage-mut:#a9c0b3;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#edf1ec; --bg2:#e3e9e2; --surface:#fbfdfa; --surface2:#f0f4ef; --line:#cdd8cf;
    --fg:#14231c; --muted:#53675c; --accent:#9b5a0e; --accent-ink:#fff8ec; --jade:#1c7a58; --danger:#b3402f;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#edf1ec; --bg2:#e3e9e2; --surface:#fbfdfa; --surface2:#f0f4ef; --line:#cdd8cf;
  --fg:#14231c; --muted:#53675c; --accent:#9b5a0e; --accent-ink:#fff8ec; --jade:#1c7a58; --danger:#b3402f;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg) var(--pat,none);background-size:var(--pat-size,auto);color:var(--fg);font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 108px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0}
.app{max-width:1040px;margin:0 auto}
.mono{font-family:var(--f-mono)}

/* en-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:1.5rem;letter-spacing:.02em}
.logo svg{width:28px;height:28px;flex:none}
.chips{display:flex;gap:8px;margin-left:auto;align-items:center;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:.85rem;white-space:nowrap}
.chip svg{width:15px;height:15px;color:var(--jade)}
.chip b{font-family:var(--f-mono);font-weight:500}
.dot-ok{width:8px;height:8px;border-radius:50%;background:var(--jade)}
.dot-guest{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:35;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;color:var(--muted);font-size:.72rem;border-radius:10px;position:relative}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.tab .ping{position:absolute;top:4px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--accent)}
@media (min-width:760px){
  body{padding-block:0 48px}
  .tabs{position:static;display:flex;gap:4px;background:none;border:0;padding:0;order:2;width:100%}
  .tab{flex-direction:row;gap:8px;padding:8px 14px;font-size:.92rem}
  .tab.on{background:var(--surface);color:var(--accent)}
}

main{padding-top:8px;min-width:0}
.sec{margin:0 0 28px}
.sec>h2{font-size:1.35rem;margin-bottom:12px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec>h2 small{font:400 .85rem var(--f-body);color:var(--muted)}
.muted{color:var(--muted)}
.lead{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:24px}
.lead h1{font-size:1.5rem}
.lead p{margin:2px 0 0;color:var(--muted)}
.bar{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--jade),var(--accent));border-radius:99px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:500;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn-primary:hover{filter:brightness(1.07);border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn svg{width:16px;height:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}

/* sachets */
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.pack{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.pack-art{flex:none;width:112px;padding-top:26px}
.pack-info{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.pack-info h3{font-size:1.25rem}
.pack-info p{margin:0;color:var(--muted);font-size:.9rem}
.pips{display:flex;gap:5px}
.pips i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);background:var(--bg2)}
.pips i.on{background:var(--accent);border-color:var(--accent)}
.cost{display:flex;align-items:center;gap:6px;font-family:var(--f-mono)}
.cost svg{width:16px;height:16px;color:var(--jade)}

.bag{--pk:#2f5d4a;--pk2:#1d3f32;--bfs:14px;font-size:var(--bfs);position:relative;width:12em;height:16em;margin-inline:auto}
.pack-art .bag{--bfs:9.3px}
.bag-body{position:absolute;inset:1.6em 0 0 0;border-radius:.4em .4em .9em .9em;z-index:2;display:grid;place-items:center;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 .2em,transparent .2em 1.4em),linear-gradient(170deg,var(--pk),var(--pk2));
  box-shadow:0 1em 2em rgba(0,0,0,.4),inset 0 0 0 .12em rgba(255,255,255,.08)}
.bag-label{width:78%;padding:1.1em .5em;text-align:center;border:.12em solid #d9b45a;border-radius:.5em;color:#f3e6c0;background:rgba(0,0,0,.2)}
.bag-label small{display:block;font-size:.62em;letter-spacing:.22em;text-transform:uppercase;opacity:.85}
.bag-label b{display:block;font-family:var(--f-display);font-size:1.45em;font-weight:400;margin:.2em 0}
.bag-label i{font-style:normal;font-size:.72em;letter-spacing:.1em}
.bag-flap{position:absolute;left:0;right:0;top:0;height:2.7em;z-index:3;background:linear-gradient(180deg,var(--pk2),var(--pk));clip-path:var(--zz);
  transform-origin:0 100%;transition:transform .9s cubic-bezier(.5,0,.2,1),opacity .9s}
.bag-peek{position:absolute;left:12%;right:12%;top:2em;height:10em;z-index:1;transition:transform .9s .25s cubic-bezier(.2,.8,.2,1)}
.bag-peek i{position:absolute;inset:0;border-radius:.5em;border:.15em solid #d9b45a;background:linear-gradient(160deg,#245443,#0f2a20)}
.bag-peek i:nth-child(1){transform:rotate(-6deg)}
.bag-peek i:nth-child(3){transform:rotate(6deg)}
.bag-tag{position:absolute;z-index:5;top:-2.6em;right:1.4em;width:2.6em;height:5.6em;padding:0;border:0;background:none}
.bag-tag svg{width:100%;height:100%;display:block;transform-origin:50% 0;animation:sway 2.8s ease-in-out infinite}
.bag.static .bag-tag{pointer-events:none}
.bag.static .bag-tag svg{animation:none}
.steam{position:absolute;top:-1em;left:18%;right:18%;height:5em;z-index:4;pointer-events:none}
.steam i{position:absolute;bottom:0;width:.5em;height:2.6em;border-radius:1em;background:linear-gradient(transparent,rgba(255,255,255,.55));opacity:0;filter:blur(1.5px)}
.steam i:nth-child(1){left:8%}.steam i:nth-child(2){left:28%}.steam i:nth-child(3){left:48%}.steam i:nth-child(4){left:66%}.steam i:nth-child(5){left:86%}
.bag.torn .bag-flap{transform:translate(55%,-110%) rotate(26deg);opacity:0}
.bag.torn .bag-peek{transform:translateY(-3.4em)}
.bag.torn .bag-tag{transform:translateY(-3em) rotate(20deg);opacity:0;transition:transform .7s,opacity .7s;pointer-events:none}
.bag.torn .bag-tag svg{animation:none}
.bag.torn .steam i{animation:rise 2.2s ease-out infinite}
.bag.torn .steam i:nth-child(2){animation-delay:.3s}.bag.torn .steam i:nth-child(3){animation-delay:.7s}.bag.torn .steam i:nth-child(4){animation-delay:.15s}.bag.torn .steam i:nth-child(5){animation-delay:.5s}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes rise{0%{opacity:0;transform:translateY(1.5em) scaleY(.6)}30%{opacity:.8}100%{opacity:0;transform:translateY(-3.5em) scaleY(1.2)}}

/* cartes */
.cw{container-type:inline-size;width:100%;position:relative}
.card{font-size:5cqw;position:relative;aspect-ratio:2/3;display:flex;flex-direction:column;gap:.5em;padding:1em 1.1em;color:var(--cink);border-radius:1.2em;
  border:.24em solid var(--rc);background:linear-gradient(var(--paper),var(--paper)) padding-box;box-shadow:0 .4em 1.2em rgba(0,0,0,.3);overflow:hidden;text-align:left;min-width:0}
.r0{--rc:var(--r0)}.r1{--rc:var(--r1)}.r2{--rc:var(--r2)}.r3{--rc:var(--r3)}.r4{--rc:var(--r4)}
.card.r4{border-color:transparent;background:linear-gradient(var(--paper),var(--paper)) padding-box,linear-gradient(135deg,#f6d77a,#a9751f 35%,#f9eaa8 55%,#b9822a) border-box}
.card.r4::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.55) 50%,transparent 62%);transform:translateX(-120%);animation:shine 5s ease-in-out infinite}
.card.r3{box-shadow:0 .4em 1.2em rgba(0,0,0,.3),0 0 1.4em color-mix(in srgb,var(--r3) 45%,transparent)}
@keyframes shine{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:.5em;font-family:var(--f-mono);font-size:.78em;letter-spacing:.04em;text-transform:uppercase;color:var(--cmut)}
.c-top small{font-size:1em;opacity:.7}
.c-rar{color:var(--rc);font-weight:500}
.card.r0 .c-rar{color:var(--cmut)}
.c-art{position:relative;flex:0 0 auto;height:11.2em;border-radius:.8em;display:grid;place-items:center;overflow:hidden;background:color-mix(in srgb,var(--cc) 20%,var(--paper))}
.c-art svg{width:100%;height:100%;display:block;color:var(--cink)}
.c-new{position:absolute;top:.5em;right:.5em;font-style:normal;font-family:var(--f-mono);font-size:.7em;letter-spacing:.08em;text-transform:uppercase;padding:.25em .7em;border-radius:99px;background:var(--cink);color:#f6d77a}
.c-name{font-family:var(--f-display);font-size:1.5em;line-height:1.1;margin:.1em 0 0;min-height:2.2em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.c-brand{margin:0;font-size:.82em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-meta{margin:0;font-size:.8em;color:var(--cmut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-tags{display:flex;gap:.4em;flex-wrap:wrap;list-style:none;margin:0;padding:0;max-height:1.9em;overflow:hidden}
.c-tags li{font-size:.72em;padding:.15em .65em;border-radius:99px;background:color-mix(in srgb,var(--cc) 16%,var(--paper));border:1px solid color-mix(in srgb,var(--cc) 40%,transparent);white-space:nowrap}
.c-score{margin-top:auto;display:flex;align-items:baseline;gap:.3em;font-family:var(--f-mono)}
.c-score b{font-size:2.1em;line-height:1;font-weight:500}
.c-score span{font-size:.8em;color:var(--cmut)}
.c-score small{margin-left:auto;font-size:.68em;letter-spacing:.08em;text-transform:uppercase;color:var(--cmut)}
@container (max-width:190px){.c-tags,.c-meta{display:none}.c-art{height:12.4em}}
.card.lock .c-art svg{filter:grayscale(1) brightness(.55);opacity:.5}
.card.lock{background:linear-gradient(#dfe5dc,#dfe5dc) padding-box}
.card.lock.r4{background:linear-gradient(#dfe5dc,#dfe5dc) padding-box,linear-gradient(135deg,#f6d77a,#a9751f 35%,#f9eaa8 55%,#b9822a) border-box}
.c-q{position:absolute;font-family:var(--f-display);font-weight:400;font-size:4.5em;color:var(--cink);opacity:.55}
.copies{position:absolute;right:.4rem;bottom:.4rem;z-index:3;font-family:var(--f-mono);font-size:.78rem;padding:2px 8px;border-radius:99px;background:var(--cink);color:#f3f5ef}
.cback{font-size:5cqw;aspect-ratio:2/3;border-radius:1.2em;border:.24em solid var(--bd,#d9b45a);display:grid;place-items:center;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.07) 0 6em,transparent 6.1em),repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 .5em,transparent .5em 1.3em),linear-gradient(160deg,#245443,#0f2a20);box-shadow:0 .4em 1.2em rgba(0,0,0,.35)}
.cback div{display:grid;place-items:center;gap:.6em;color:#e9cf8b;font-family:var(--f-display);font-size:1.7em;letter-spacing:.04em}
.cback svg{width:3.2em;height:3.2em}

/* collection */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.filters input,.filters select{width:100%;min-height:42px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-width:0}
.filters input{grid-column:1/-1}
.rchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.rchip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.85rem}
.rchip i{width:9px;height:9px;border-radius:50%;background:var(--rc,var(--muted))}
.rchip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.cell{display:block;padding:0;border:0;background:none;text-align:left;border-radius:14px;min-width:0}
.cell:hover .card{transform:translateY(-3px)}
.card{transition:transform .2s}
.empty{padding:36px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

/* classement */
.sub{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.sub select{min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) 92px 22px;gap:10px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left}
.row:hover{border-color:var(--muted)}
.row .rk{font-family:var(--f-mono);font-size:1rem;color:var(--muted)}
.row:nth-child(-n+3) .rk{color:var(--accent);font-weight:500}
.row .rn{min-width:0}
.row .rn b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rn small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rs{display:flex;align-items:center;gap:8px;font-family:var(--f-mono)}
.row .rs span{flex:1;height:6px;background:var(--bg2);border-radius:9px;overflow:hidden}
.row .rs span i{display:block;height:100%;background:var(--rc)}
.row .own{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.row .own.y{background:var(--jade);border-color:var(--jade);color:var(--bg)}
.row .own svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.brow{grid-template-columns:44px minmax(0,1fr) 120px}
.brow .rs{flex-direction:column;align-items:stretch;gap:4px;font-size:.8rem;color:var(--muted)}
.brow .rs .bar{height:6px}
.tier{display:inline-block;padding:1px 8px;border:1px solid var(--line);border-radius:99px;font-size:.72rem;color:var(--muted)}
.more{display:flex;justify-content:center;margin-top:18px}

/* quêtes */
.quests{display:grid;gap:12px}
.quest{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.quest h3{font-family:var(--f-body);font-weight:500;font-size:1.02rem}
.quest .qp{grid-column:1/-1;display:flex;align-items:center;gap:12px;font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.quest .qp .bar{flex:1}
.quest.done{border-color:color-mix(in srgb,var(--jade) 60%,var(--line))}
.quest.claimed{opacity:.6}
.rw{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);color:var(--jade)}
.rw svg{width:15px;height:15px}
.streak{display:flex;gap:8px;flex-wrap:wrap}

/* profil */
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.box{padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.box h3{font-size:1.15rem;margin-bottom:10px}
.box p{margin:0 0 10px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field input{min-height:42px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2)}
dl.stats{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:0}
dl.stats dt{color:var(--muted)}
dl.stats dd{margin:0;font-family:var(--f-mono);text-align:right}
.note{font-size:.85rem;color:var(--muted)}

/* ouverture */
.ov{position:fixed;inset:0;z-index:100;display:flex;overflow:auto;color:var(--stage-fg);
  background:radial-gradient(ellipse at 50% 25%,var(--stage2),var(--stage) 72%);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov-col{margin:auto;width:100%;max-width:680px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding-top:40px}
.ov-x{position:fixed;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:5;padding:8px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:var(--stage-fg)}
.ov-hint{font-family:var(--f-display);font-size:1.3rem;margin:0}
.ov-sub,.ov-count{margin:0;color:var(--stage-mut)}
.ov-count{font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;font-size:.85rem}
.ov .bag{--bfs:20px;margin-top:56px}
.deck{position:relative;width:min(66vw,270px,calc((100dvh - 290px) * .667));min-width:150px}
.deck::after{content:"";position:absolute;inset:-18%;z-index:-1;border-radius:50%;opacity:0;pointer-events:none}
.deck.g3.done::after{background:radial-gradient(circle,color-mix(in srgb,var(--r3) 60%,transparent),transparent 65%);animation:pulse 1.6s ease-out}
.deck.g4.done::after{background:radial-gradient(circle,color-mix(in srgb,var(--r4) 75%,transparent),transparent 65%);animation:pulse 2s ease-out}
@keyframes pulse{0%{opacity:0;transform:scale(.6)}35%{opacity:1}100%{opacity:.35;transform:scale(1.1)}}
.flipper{perspective:1200px;position:relative;aspect-ratio:2/3;width:100%;animation:enter .7s cubic-bezier(.2,.8,.2,1) both}
.flip-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.flipper.flipped .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{transform:rotateY(180deg)}
@keyframes enter{from{opacity:0;transform:translateY(40%) scale(.82)}to{opacity:1;transform:none}}
.ov-info{min-height:3em;font-size:1rem;color:var(--stage-fg)}
.ov-info b{font-family:var(--f-display);font-weight:400;font-size:1.2rem;display:block}
.ov-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.dots{display:flex;gap:8px}
.dots i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.35)}
.dots i.on{background:var(--rc);border-color:var(--rc)}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;width:100%}
.sumcell{display:flex;flex-direction:column;gap:8px;min-width:0}
.sumcap{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--stage-mut)}
.sumcap.n{color:#f6d77a}
.ov .btn{color:var(--stage-fg);background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22)}
.ov .btn-primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* fiche */
.md{position:fixed;inset:0;z-index:90;display:flex;overflow:auto;background:rgba(3,10,7,.72);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.md-box{margin:auto;position:relative;display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:flex-start;max-width:700px;width:100%;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.md-card{width:min(100%,280px);flex:none}
.md-info{flex:1 1 240px;min-width:0}
.md-info h2{font-size:1.5rem;margin-bottom:4px}
.md-info dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0 0}
.md-info dt{color:var(--muted)}
.md-info dd{margin:0;overflow-wrap:anywhere}
.md-x{position:absolute;top:10px;right:10px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:120;padding:10px 18px;border-radius:12px;background:var(--fg);color:var(--bg);opacity:0;pointer-events:none;transition:.3s;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:760px){.toast{bottom:32px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:420px){.row{grid-template-columns:34px minmax(0,1fr) 22px}.row .rs{display:none}.pack{flex-direction:column;text-align:center;align-items:center}.pips{justify-content:center}.cost{justify-content:center}.pack-info{align-items:center;width:100%}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ===== v2 : boutons d'en-tête, feuilles modales, thèmes ===== */
:root{--navh:68px}
.logo{cursor:default}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:38px;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);font-size:.82rem}
.ibtn:hover{border-color:var(--muted)}
.ibtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab .lbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.hl{color:var(--accent);animation:hl 1.1s ease-in-out infinite}
@keyframes hl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (max-width:420px){.tab{font-size:.64rem}.tab svg{width:20px;height:20px}.chip{padding:4px 8px}.chips{gap:6px}}
.cute-radius .box,.cute-radius .pack,.cute-radius .lead,.cute-radius .quest{border-radius:22px}
.sh{position:fixed;inset:0;z-index:95;display:flex;overflow:auto;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(6px);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sh.solid{background:var(--bg) var(--pat,none);background-size:var(--pat-size,auto);backdrop-filter:none}
.sh-box{margin:auto;position:relative;width:100%;max-width:640px;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.28)}
.sh-box h2{font-size:1.5rem;margin-bottom:6px}
.sh-x{position:absolute;top:10px;right:10px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2)}
.sh-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row2{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.msg{padding:10px 14px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:.92rem}
.msg.err{border-color:color-mix(in srgb,var(--danger) 60%,var(--line))}
.msg.ok{border-color:color-mix(in srgb,var(--jade) 60%,var(--line))}
.pill{display:inline-block;padding:1px 9px;border:1px solid var(--line);border-radius:99px;font-size:.74rem;color:var(--muted);background:var(--bg2)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--f-display);font-size:1.15rem;color:var(--accent-ink);background:var(--accent);position:relative}
.avatar .st{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--surface);background:var(--muted)}
.avatar .st.on{background:#3fcf7a}
.welcome-logo{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.welcome-logo h1{font-size:2.2rem}
.choice{display:grid;gap:10px;margin-top:14px}
.choice .btn{justify-content:flex-start;text-align:left;padding:14px 18px;min-height:56px}
.choice .btn small{display:block;font-weight:400;color:inherit;opacity:.75}
.choice .btn span{display:block}
.seg.wrap{flex-wrap:wrap}

/* personnalisation */
.cu-sec{margin:18px 0 0}
.cu-sec h3{font-size:1.05rem;margin-bottom:8px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.sw{display:flex;flex-direction:column;gap:6px;align-items:stretch;padding:8px;border-radius:14px;border:2px solid var(--line);background:var(--surface2);text-align:left}
.sw[aria-pressed="true"]{border-color:var(--accent)}
.sw .pv{height:42px;border-radius:9px;display:flex;overflow:hidden;border:1px solid rgba(128,128,128,.25)}
.sw .pv i{flex:1}
.sw span{font-size:.85rem}
.sw .pat{height:42px;border-radius:9px;border:1px solid var(--line);background-color:var(--bg)}

.cb .cback{font-size:2.2px}
.cb .cback div{font-size:1.9em}

/* sachets, boîtes */
.bag{--pk:#2f5d4a;--pk2:#1d3f32}
.packs{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.pack-btns{display:flex;gap:8px;flex-wrap:wrap}
.pack-btns .btn{padding:8px 12px;min-height:40px;font-size:.9rem}
.pack-info .sm{font-size:.82rem;color:var(--muted)}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes .rchip{font-size:.82rem}
.boxbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px 18px;margin-bottom:24px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.mini-box{width:78px;height:46px;border-radius:7px;background:linear-gradient(180deg,var(--pk),var(--pk2));border:2px solid #d9b45a;position:relative;flex:none;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.mini-box::before{content:"";position:absolute;left:6px;right:6px;top:7px;bottom:7px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 11px,transparent 11px 14px);border-radius:3px}
.bx{position:relative;width:min(100%,600px);margin-inline:auto;perspective:1400px}
.bx-body{position:relative;padding:14px 14px 16px;border-radius:14px;background:linear-gradient(170deg,var(--pk),var(--pk2));border:3px solid #d9b45a;box-shadow:0 22px 50px rgba(0,0,0,.5),inset 0 0 0 2px rgba(0,0,0,.25)}
.bx-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 10px;color:#f3e6c0;font-family:var(--f-display);letter-spacing:.06em;font-size:1rem}

.bx-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.bx-slot{container-type:inline-size;position:relative;aspect-ratio:3/4.2;border-radius:9px;background:rgba(0,0,0,.34);box-shadow:inset 0 3px 8px rgba(0,0,0,.55);display:grid;place-items:end center;overflow:hidden;padding:0;border:0}
.bx-slot .bag{--bfs:7.4cqw;margin:0 auto 4%;transition:transform .25s}
.bx-slot .bag .steam{display:none}
.bx-slot:not(:disabled):hover .bag,.bx-slot:not(:disabled):focus-visible .bag{transform:translateY(-8%) rotate(-2deg)}
.bx-slot:disabled{box-shadow:inset 0 3px 8px rgba(0,0,0,.65);opacity:.7}

.bx-lid{position:absolute;inset:0;z-index:4;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#f3e6c0;text-align:center;border:0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 .5em,transparent .5em 1.4em),linear-gradient(170deg,var(--pk),var(--pk2));box-shadow:inset 0 0 0 3px #d9b45a;
  transform-origin:50% 0;transition:transform .9s cubic-bezier(.5,0,.2,1),opacity .9s}
.bx-lid b{font-family:var(--f-display);font-size:1.5rem;font-weight:400}
.bx-lid small{letter-spacing:.14em;text-transform:uppercase;font-size:.76rem}
.bx.open .bx-lid{transform:rotateX(-100deg) translateY(-12%);opacity:0;pointer-events:none}
.bx-sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;width:100%}
.bx-stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.bx-stats .chip{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:var(--stage-fg)}

/* modes d'ouverture */
.fan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:560px;margin-inline:auto}
@media (max-width:420px){.fan{gap:8px}}
.fan .fcell{background:none;border:0;padding:0;display:block;perspective:1000px;text-align:left}
.fan .flipper{animation-delay:calc(var(--i,0)*.08s)}
.fan .fcell:hover .flipper:not(.flipped){transform:translateY(-4px)}
.fan .flipper{transition:transform .2s}
.fan .rb{position:absolute;inset:-4px;border-radius:1.3em;z-index:-1;opacity:0}
.fan .flipped .rb{opacity:1}
.cupscene{position:relative;width:230px;height:200px;margin:8px auto 0}
.cupscene .cup{position:absolute;left:30px;right:30px;bottom:6px;height:92px;border-radius:6px 6px 52px 52px;background:linear-gradient(#fbfcf8,#dfe5da);border:2px solid rgba(0,0,0,.25);overflow:hidden;box-shadow:0 10px 22px rgba(0,0,0,.4)}
.cupscene .water{position:absolute;left:0;right:0;bottom:0;height:78%;background:#e9d9a0;transform:translateY(100%);transition:transform 1.2s ease-out,background-color 3.2s linear}
.cupscene.steep .water{transform:none;background:var(--cupcol,#a56a1f)}
.cupscene .handle{position:absolute;right:14px;bottom:30px;width:34px;height:46px;border:7px solid #e6ebe1;border-left:0;border-radius:0 30px 30px 0;box-shadow:inset -1px 0 0 rgba(0,0,0,.2)}
.cupscene .sbag{position:absolute;left:50%;top:0;width:54px;height:70px;margin-left:-27px;transition:transform 1.4s cubic-bezier(.3,.7,.3,1);transform:translateY(0)}
.cupscene.steep .sbag{transform:translateY(62px)}
.cupscene .sbag i{position:absolute;inset:14px 0 0;border-radius:4px 4px 10px 10px;background:linear-gradient(160deg,#f3ead1,#d8c9a0);border:1px solid rgba(0,0,0,.25)}
.cupscene .sbag u{position:absolute;left:50%;top:-40px;width:1.5px;height:56px;background:#e8d9a0}
.cupscene .steam{top:-20px;left:30%;right:30%}
.cupscene.steep .steam i{animation:rise 2.2s ease-out infinite}
.cupscene.steep .steam i:nth-child(2){animation-delay:.3s}.cupscene.steep .steam i:nth-child(3){animation-delay:.7s}.cupscene.steep .steam i:nth-child(4){animation-delay:.15s}.cupscene.steep .steam i:nth-child(5){animation-delay:.5s}
.steepbar{width:min(260px,70vw);height:6px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden;margin:0 auto}
.steepbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f6d77a,#e3a74f);transition:width 3.4s linear}
.steep .steepbar i{width:100%}

.rc0{--rc:var(--r0)}.rc1{--rc:var(--r1)}.rc2{--rc:var(--r2)}.rc3{--rc:var(--r3)}.rc4{--rc:var(--r4)}

/* mascotte */
.cat-svg{display:block;width:100%;height:auto;overflow:visible}
.cat-svg .emo{display:none}
.cat-svg[data-emo="neutral"] .e-neutral,.cat-svg[data-emo="happy"] .e-happy,.cat-svg[data-emo="sad"] .e-sad,.cat-svg[data-emo="surprised"] .e-surprised,.cat-svg[data-emo="think"] .e-think,.cat-svg[data-emo="excited"] .e-excited,.cat-svg[data-emo="sleepy"] .e-sleepy{display:inline}
.cat-svg .coat,.cat-svg .glasses{display:none}
.cat-svg.lab .coat,.cat-svg.lab .glasses{display:inline}
.cat-svg .tail{transform-box:fill-box;transform-origin:0% 100%;animation:wag 2.2s ease-in-out infinite}
.cat-svg .zz{display:none;font:700 14px var(--f-body);fill:var(--muted)}
.cat-svg[data-emo="sleepy"] .zz{display:inline;animation:zz 2s ease-in-out infinite}
.cat-svg .qm{display:none;font:700 20px var(--f-display);fill:var(--accent)}
.cat-svg[data-emo="think"] .qm{display:inline;animation:zz 1.6s ease-in-out infinite}
.cat-svg .spark{display:none;fill:#f6d77a}
.cat-svg[data-emo="excited"] .spark,.cat-svg[data-emo="happy"] .spark.s2{display:inline;animation:tw 1.2s ease-in-out infinite}
.cat-svg.dress .coat{animation:coatin .8s cubic-bezier(.3,1.4,.5,1) both}
.cat-svg.dress .glasses{animation:glin .9s .5s cubic-bezier(.3,1.6,.5,1) both}
.cat-svg .paw{transform-box:fill-box;transform-origin:50% 0}
.cat-svg.walk .bodyg{animation:bob .38s ease-in-out infinite}
.cat-svg.walk .paw.l{animation:step .38s ease-in-out infinite}
.cat-svg.walk .paw.r{animation:step .38s ease-in-out infinite .19s}
.cat-svg.walk .tail{animation-duration:.8s}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes step{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes zz{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-5px);opacity:1}}
@keyframes tw{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@keyframes coatin{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes glin{from{transform:translateY(-34px);opacity:0}to{transform:none;opacity:1}}
#cat{position:fixed;left:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 2px);z-index:33;width:88px;pointer-events:none;transition:opacity .35s}
@media (min-width:760px){#cat{bottom:6px}}
#cat.gone{opacity:0}
#cat.gone .cat-body{pointer-events:none}
#cat .cat-move{position:relative;transition-property:transform;transition-timing-function:linear;will-change:transform}
#cat .cat-body{pointer-events:auto;cursor:pointer;display:block;border:0;background:none;padding:0;width:88px;transform-origin:50% 100%;transition:transform .2s}
#cat .cat-body.flip{transform:scaleX(-1)}
#cat .cat-body:focus-visible{outline:2px solid var(--accent);border-radius:12px}
#cat.pop .cat-body{animation:popin .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{transform:scale(.3) translateY(30px)}to{transform:scale(1)}}
.speech{position:absolute;bottom:calc(100% - 2px);left:50%;transform:translateX(var(--sx,-50%));width:max-content;max-width:min(240px,calc(100vw - 32px));padding:9px 12px;border-radius:14px;background:var(--fg);color:var(--bg);font-size:.86rem;line-height:1.35;pointer-events:auto;z-index:2;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.speech::after{content:"";position:absolute;top:100%;left:var(--ax,50%);margin-left:-6px;border:6px solid transparent;border-top-color:var(--fg)}
.speech[hidden]{display:none}
.speech .sa{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.speech .sa button{padding:4px 10px;border-radius:99px;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);background:transparent;color:var(--bg);font-size:.8rem}
.speech .sa button.pr{background:var(--bg);color:var(--fg)}
.peek{position:fixed;z-index:34;border:0;background:none;padding:6px;cursor:pointer;animation:peekin .6s cubic-bezier(.3,1.4,.5,1) both}
.peek svg{display:block;overflow:visible}
.peek.tailL{left:0;width:74px}.peek.tailR{right:0;width:74px}
.peek.tailL svg,.peek.tailR svg{width:100%;transform-origin:0 50%;animation:peekwag 1.1s ease-in-out infinite}
.peek.tailR svg{transform:scaleX(-1);transform-origin:50% 50%}
.peek.ear{width:62px;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) - 3px)}
@media (min-width:760px){.peek.ear{bottom:-12px}}
.peek.ear svg{animation:earwig 1.8s ease-in-out infinite;transform-origin:50% 100%}
@keyframes peekin{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes peekwag{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
@keyframes earwig{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.peek .sp{position:absolute;right:-6px;top:-10px;font-size:1.1rem;animation:tw 1.2s infinite}
.fx-leaf{position:fixed;z-index:121;pointer-events:none;font-family:var(--f-mono);font-weight:500;color:var(--accent);animation:floatup 1.4s ease-out forwards}

function genQuests(day){
  var r=mulberry(h32(day)),keys=Object.keys(QT);
  keys=keys.map(function(k){return [k,r()]}).sort(function(a,b){return a[1]-b[1]}).map(function(x){return x[0]});
  var list=[],hasQuiz=false;
  for(var q=0;q<keys.length&&list.length<3;q++){
    var T=QT[keys[q]];if(T.ev==='quiz'&&hasQuiz)continue;
    var p=T.mk(r);if(p){if(T.ev==='quiz')hasQuiz=true;list.push({t:keys[q],p:p,prog:0,claimed:false})}
  }
  return list;
}
function ensureDay(){
  var k=todayKey();
  if(S.quests&&S.quests.day===k)return false;
  S.quests={day:k,list:genQuests(k),bonus:false};
  if(S.streak.last===yesterdayKey())S.streak.n++;else if(S.streak.last!==k)S.streak.n=1;
  S.streak.last=k;
  touch();return true;
}

  if(!S.quests)return;

}

  var T=QT[q.t];if(q.prog<T.goal(q.p))return;
  q.claimed=true;S.leaves+=T.rw;var msg=t('+{n} feuilles',{n:T.rw});

/* ================= QUIZ ================= */
var QZS=null,QR=[0,2,3,5,8,4],QB=[0,6,12,20,35,30];
function quizStart(dd){
  dd=dd||2;
  var seen=S.qseen||[];
  function poolBy(d){var pk=S.planet||'tea';if(pk!=='tea'&&d!==5){var own=function(i){return QBANK[i].u===pk},idx=QBANK.map(function(q,i){return i}).filter(own),main=idx.filter(function(i){return QBANK[i].d===d}),fresh=function(l){return shuffle(l.filter(function(i){return seen.indexOf(i)<0}).concat(l.filter(function(i){return seen.indexOf(i)>=0})).filter(function(x,k,r){return r.indexOf(x)===k}))},out=fresh(main);if(out.length<8){var near=idx.filter(function(i){return Math.abs(QBANK[i].d-d)===1}).sort(function(a,b){return Math.abs(QBANK[a].d-d)-Math.abs(QBANK[b].d-d)||Math.random()-.5});out=out.concat(near.filter(function(i){return seen.indexOf(i)<0}).concat(near.filter(function(i){return seen.indexOf(i)>=0})))}return out.slice(0,8)}
  var p=QBANK.map(function(q,i){return i}).filter(function(i){return QBANK[i].d===d&&!QBANK[i].u});var fr=p.filter(function(i){return seen.indexOf(i)<0});return shuffle(fr.length>=8?fr:p)}
  var ix=poolBy(dd).slice(0,8);
  S.qseen=seen.concat(ix).slice(-120);
  QZS={d:dd,i:0,right:0,streak:0,ans:null,hist:[],done:false,res:null,
   list:ix.map(function(qi){var q=QBANK[qi];return {qi:qi,opts:shuffle(q.a.map(function(a,k){return {a:a,ok:k===0}}))}})};
  touch();
}
function quizAnswer(k){
  if(!QZS||QZS.ans)return;
  var ok=QZS.list[QZS.i].opts[k].ok;
  QZS.ans={k:k,ok:ok};QZS.hist.push(ok);
  if(ok){QZS.right++;QZS.streak++;addBond(1)}else QZS.streak=0;
}
function quizNext(){
  if(!QZS||!QZS.ans)return;
  QZS.i++;QZS.ans=null;
  if(QZS.i>=QZS.list.length)quizFinish();
}
function quizFinish(){
  var day=todayKey(),used=S.qz.day===day?S.qz.n:0,full=used<3,base=0;
  QZS.list.forEach(function(q,i){if(QZS.hist[i]){base+=full?QR[QZS.d]:Math.max(2,Math.round(QR[QZS.d]*.25))}});
  var perfect=full&&QZS.right===QZS.list.length,sachet=full&&QZS.right>=6;
  var total=base+(perfect?QB[QZS.d]:0);
  S.leaves+=total;if(sachet)S.stock++;
  S.qz={day:day,n:used+1};S.stats.quiz=(S.stats.quiz||0)+1;S.stats.right=(S.stats.right||0)+QZS.right;
  questEvent({k:'quiz',ok:QZS.right,total:QZS.list.length});
  addBond(2);
  QZS.done=true;QZS.res={base:base,perfect:perfect,sachet:sachet,full:full,total:total};
  touch();
}
function quizLeft(){return Math.max(0,3-(S.qz.day===todayKey()?S.qz.n:0))}

var SO={ok:false,err:'',fans:{},online:{},roomOk:false,started:false,notified:{},ping:false,room:null};
function codeOf(uid){
  var A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',a=h32(uid),b=h32(uid+'#c'),s='',i;
  for(i=0;i<6;i++)s+=A[(a>>>(i*5))&31];
  for(i=0;i<2;i++)s+=A[(b>>>(i*5))&31];
  return s;
}
function myCode(){return CL.uid?codeOf(CL.uid):''}
function showCode(c){return c?c.slice(0,4)+'-'+c.slice(4):''}
function myName(){return S.pseudo||t('Dégustateur')}
function socialOn(){return !!(CL.db&&CL.uid&&S.set.soc&&CL.state!=='readonly'&&CL.canWrite!==false&&SO.err!=='invalid_argument'&&S.ob>=1)}
function pubOwned(){return Object.keys(S.owned).map(function(id){return id+'~'+S.owned[id][0]}).join(',')}
function pubDoc(){return {p:myName(),cd:myCode(),fr:S.fr,n:Object.keys(S.owned).length,lv:levelIdx(),o:pubOwned(),of:S.of,rs:S.rs,sk:S.set.skin,av:avPub(),bw:S.stats.bw||0,hr:S.hero|0,bt:pubBattles()}}
function parseOwned(s){var o={};if(!s)return o;s.split(',').forEach(function(x){var p=x.split('~');if(BYID[p[0]])o[p[0]]=+p[1]||1});return o}
function schedulePub(){if(!socialOn()||!SO.started)return;clearTimeout(pubTimer);pubTimer=setTimeout(function(){pubFlush()},2500)}
function pubFlush(force){
  if(!socialOn()||pubBusy){if(pubBusy)schedulePub();return}
  var d=pubDoc(),j=JSON.stringify(d);if(j===lastPub&&!force)return;
  pubBusy=true;
  CL.db.doc('players/'+CL.uid).set(d).then(function(){lastPub=j;if(SO.err==='error')SO.err=''}).catch(function(e){SO.err=(e&&e.code)||'error'}).then(function(){
    pubBusy=false;if(socialOn()&&JSON.stringify(pubDoc())!==lastPub)schedulePub();if(window.WEBSOC&&WEBSOC.poke)WEBSOC.poke();hooks.social()
  });
}
function startSocial(){
  if(SO.started||!socialOn())return;
  SO.started=true;pubFlush(true);
  try{
    SO.unsub=CL.db.collection('players').where('fr','array-contains',CL.uid).onSnapshot(function(snap){
      var f={};snap.docs.forEach(function(d){f[d.id]=d.data()});SO.fans=f;
      if(!snap.metadata.fromCache){SO.ok=true;processSocial()}
      notifySocial();hooks.social();
    },function(e){SO.err=(e&&e.code)||'error';hooks.social()});
  }catch(e){SO.err='error'}
  if(!(window.claude&&window.claude.use))return;
  window.claude.use('room').then(function(room){
    if(!room)return;SO.room=room;
    function upd(peers){var on={};peers.forEach(function(p){if(!p.isMe&&p.by)on[p.by]=1});SO.online=on;SO.roomOk=true;hooks.social()}
    room.presence({p:myName()}).catch(function(){});
    room.onPeers(function(ch){upd(ch.peers)},function(){});
    upd(room.peers());
  }).catch(function(){});
}
function stopSocial(){
  if(CL.db&&CL.uid){try{CL.db.doc('players/'+CL.uid).delete()}catch(e){}}
  lastPub='';
}
function friendsList(){return (S.fr||[]).filter(function(u){return SO.fans[u]}).map(function(u){return {uid:u,d:SO.fans[u],on:!!SO.online[u]}}).sort(function(a,b){return (b.on-a.on)||String(a.d.p).localeCompare(String(b.d.p))})}
function pendingOut(){return SO.ok?(S.fr||[]).filter(function(u){return !SO.fans[u]}):[]}
function pendingIn(){return Object.keys(SO.fans).filter(function(u){return S.fr.indexOf(u)<0&&S.ign.indexOf(u)<0})}
function incomingOffers(){
  var out=[];
  friendsList().forEach(function(f){
    var of=f.d.of||{};
    Object.keys(of).forEach(function(tid){var o=of[tid];if(o&&o.to===CL.uid&&o.st==='open'&&!S.esc[tid]&&!S.rs[tid])out.push({tid:tid,from:f.uid,name:f.d.p,g:o.g||[],w:o.w||[]})});
  });
  return out;
}
function myOpenOffers(){return Object.keys(S.of).filter(function(tid){return S.of[tid].st==='open'&&S.esc[tid]}).map(function(tid){return {tid:tid,o:S.of[tid]}})}
function waitingAccepted(){return Object.keys(S.esc).filter(function(tid){return S.esc[tid].r==='B'}).map(function(tid){return {tid:tid,e:S.esc[tid]}})}
function nameOfUid(u){var d=SO.fans[u];return (d&&d.p)||S.fn[u]||t('Ami')}
function takeCards(ids){
  var c={};ids.forEach(function(id){c[id]=(c[id]||0)+1});
  var k=Object.keys(c);
  for(var i=0;i<k.length;i++){if(!S.owned[k[i]]||S.owned[k[i]][0]<c[k[i]])return false}
  k.forEach(function(id){S.owned[id][0]-=c[id];if(S.owned[id][0]<=0)delete S.owned[id]});
  return true;
}
function addCards(ids){ids.forEach(function(id){if(!BYID[id])return;var o=S.owned[id];if(o)o[0]++;else S.owned[id]=[1,Date.now()]})}
function newTid(){return 't'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36)}
function isFriend(u){return S.fr.indexOf(u)>=0&&!!SO.fans[u]}
function tradeSend(peer,give,want){
  if(!isFriend(peer))return 'nofriend';
  if(!give.length||!want.length||give.length>5||want.length>5)return 'size';
  if(myOpenOffers().length>=3)return 'toomany';
  var theirs=parseOwned(SO.fans[peer].o);
  for(var i=0;i<want.length;i++){if(!theirs[want[i]])return 'theirs'}
  if(!takeCards(give))return 'mine';
  var tid=newTid();

var ELS=[
 {id:'f',n:'Fraîcheur',c:'#3f9d63',ks:['vert','matcha','blanc','jaune'],mv:'Rafale d\'umami'},
 {id:'l',n:'Floral',c:'#cf5d8a',ks:['plantes','fruits','aroma','oolong'],mv:'Bouquet éclatant'},
 {id:'c',n:'Corsé',c:'#8a4a2a',ks:['noir','puerh'],mv:'Torréfaction'},
 {id:'e',n:'Épicé',c:'#d4821f',ks:['chai','rooibos','mate'],mv:'Épice ardente'}

var ELIDX={};ELS.forEach(function(e,i){e.ks.forEach(function(k){ELIDX[k]=i})});Object.keys(PL_EL).forEach(function(k){ELIDX[k]=PL_EL[k]});
var BMAX=30,BTEAM=3,BCAP=8;
function bMult(a,d){return ((a+1)%4===d)?1.5:(((d+1)%4===a)?.75:1)}
function bStats(c){return {id:c.id,el:ELIDX[c.k]||0,max:Math.round(40+12*c.r+c.s*.35),atk:Math.round((9+2.2*c.r+c.s/14)*1.6),spd:30+(c.hh%40)+c.r*2}}
function bNew(ta,tb){
  function mk(ids){return ids.map(function(id){var s=bStats(BYID[id]);s.hp=s.max;return s})}
  return {s:[{t:mk(ta),i:0,gcd:0,g:0},{t:mk(tb),i:0,gcd:0,g:0}],r:0,over:false,win:-1,last:[]};
}
function bAct(st,k){var sd=st.s[k];return sd.t[Math.min(sd.i,sd.t.length-1)]}
function bAlive(sd){return sd.t.some(function(f){return f.hp>0})}
function bNorm(st,k,m){m=+m;if(m===2&&st.s[k].gcd>0)m=0;return (m===1||m===2)?m:0}
function bRound(st,seed,ca,cb){
  var rng=mulberry(h32(seed+':'+st.r)),ev=[],m=[bNorm(st,0,ca),bNorm(st,1,cb)];
  st.s[0].g=0;st.s[1].g=0;
  var act=[bAct(st,0),bAct(st,1)];
  [0,1].forEach(function(k){
    if(m[k]!==2)return;
    var f=act[k],h=Math.round(f.max*.12),real=Math.max(0,Math.min(h,f.max-f.hp));f.hp+=real;st.s[k].g=1;
    ev.push({k:'guard',side:k,card:f.id,heal:real});
  });
  var order=(act[1].spd>act[0].spd)?[1,0]:[0,1];
  order.forEach(function(k){
    if(m[k]===2)return;
    var A=act[k],dk=1-k,D=bAct(st,dk);

    var pow=1,acc=1,mult=1;
    if(m[k]===1){pow=1.6;acc=.8;mult=bMult(A.el,D.el)}
    var r1=rng(),r2=rng(),r3=rng(),hit=r1<acc,crit=r3<.1;
    if(!hit){ev.push({k:'miss',side:k,card:A.id,mv:m[k]});return}
    var dmg=Math.max(1,Math.round(A.atk*pow*mult*(.9+r2*.2)*(crit?1.5:1)));
    if(st.s[dk].g)dmg=Math.max(1,Math.round(dmg*.5));
    D.hp=Math.max(0,D.hp-dmg);
    ev.push({k:'hit',side:k,card:A.id,tgt:D.id,mv:m[k],dmg:dmg,mult:mult,crit:crit,left:D.hp,guard:!!st.s[dk].g});
    if(D.hp<=0){
      ev.push({k:'ko',side:dk,card:D.id});
      var sd=st.s[dk];while(sd.i<sd.t.length&&sd.t[sd.i].hp<=0)sd.i++;if(sd.i>=sd.t.length)sd.i=sd.t.length-1;
    }

function bSim(seed,ta,tb,ma,mb){

}

function bAiTeam(tid,mine,lv){

  mine.forEach(function(id){
    var r=BYID[id].r+(lv-1);if(rng()<.3)r+=1;else if(rng()<.2)r-=1;
    r=Math.max(0,Math.min(4,r));var L=pool[r];if(!L.length)L=pool[0];
    var c=L[Math.floor(rng()*L.length)];if(team.indexOf(c.id)>=0)c=L[(L.indexOf(c)+1)%L.length];team.push(c.id)

function bOpp(tid,e){

  var F=SO.fans[e.o],oe=F&&F.bt&&F.bt[tid];
  return {t:(oe&&oe.t)||[],m:(oe&&oe.m)||'',ff:(oe&&oe.ff)?1:0,st:oe&&oe.st,ok:!!oe,name:nameOfUid(e.o)};
}
function bView(tid){
  var e=S.bm[tid];if(!e)return null;
  var oe=bOpp(tid,e),v={tid:tid,e:e,oe:oe,mine:e.a?0:1,st:null,phase:'',win:-1,iWon:false};
  if(e.st==='dec'){v.phase='dec';return v}
  if(e.ff){v.phase='over';v.win=1-v.mine;v.ff='me';v.iWon=false;return v}
  if(!e.ai&&!SO.ok&&!oe.ok){v.phase='load';return v}
  if(e.st==='ch'&&!(oe.ok&&oe.st==='go')){v.phase='pend';return v}
  if(!oe.ok||oe.t.length!==BTEAM){v.phase=(e.st==='end')?'end':'gone';return v}
  var ta=e.a?e.t:oe.t,tb=e.a?oe.t:e.t,ma=e.a?e.m:oe.m,mb=e.a?oe.m:e.m;
  var okIds=function(L){return L.length===BTEAM&&L.every(function(id){return !!BYID[id]})};
  if(!okIds(ta)||!okIds(tb)){v.phase='gone';return v}
  v.st=bSim(tid,ta,tb,ma,mb);
  if(oe.ff){v.phase='over';v.win=v.mine;v.ff='op'}

function colList(){
  var f=V.col,q=f.q.trim().toLowerCase();
  var L=plCards().filter(function(c){
    if(f.cat&&c.k!==f.cat)return false;
    if(f.brand!==''&&String(c.b)!==String(f.brand))return false;
    if(f.rar!==''&&String(c.r)!==String(f.rar))return false;
    var o=S.owned[c.id];
    if(f.own==='own'&&!o)return false;if(f.own==='miss'&&o)return false;if(f.own==='dup'&&!(o&&o[0]>1))return false;
    if(q){var hay=o?(c.n+' '+BRANDS[c.b].n+' '+c.o+' '+trOrig(c.o)+' '+c.t.join(' ')+' '+c.t.map(trTag).join(' ')+' '+catName(c.k)):catName(c.k);if(hay.toLowerCase().indexOf(q)<0)return false}
    return true;
  });
  var cmp={note:function(a,b){return b.s-a.s||a.id.localeCompare(b.id)},
   name:function(a,b){return a.n.localeCompare(b.n,LANG)},brand:function(a,b){return BRANDS[a.b].n.localeCompare(BRANDS[b.b].n,LANG)||b.s-a.s},
   rar:function(a,b){return b.r-a.r||b.s-a.s},type:function(a,b){return plCatK().indexOf(a.k)-plCatK().indexOf(b.k)||b.s-a.s},
   recent:function(a,b){return ((S.owned[b.id]||[0,0])[1])-((S.owned[a.id]||[0,0])[1])},copies:function(a,b){return ((S.owned[b.id]||[0])[0])-((S.owned[a.id]||[0])[0])}}[f.sort]||function(){return 0};
  return L.sort(cmp);
}
function cellHTML(c){var o=S.owned[c.id];
  return '<button class="cell" data-act="card" data-id="'+c.id+'" aria-label="'+esc(o?c.n:t('Carte non découverte n° {n}',{n:c.rank}))+'"><div class="cw">'+cardHTML(c,{lock:!o})+(o&&o[0]>1?'<span class="copies">×'+o[0]+'</span>':'')+'</div></button>'}
function colGroups(L){
  var m=V.col.grp,G={},order=[];
  function add(key,label,c,ord){if(!G[key]){G[key]={key:key,label:label,ord:ord,L:[]};order.push(G[key])}G[key].L.push(c)}
  L.forEach(function(c){
    if(m==='rar')add('r'+c.r,rarName(c.r),c,-c.r);
    else if(m==='type')add('k'+c.k,catName(c.k),c,plCatK().indexOf(c.k));
    else if(m==='brand')add('b'+c.b,BRANDS[c.b].n,c,0);
    else add('o'+c.o,trOrig(c.o),c,0);
  });
  order.sort(function(a,b){return (a.ord-b.ord)||a.label.localeCompare(b.label,LANG)});
  return order;
}

/* ----- composeur d'échange ----- */
var TR=null;
function trItems(side){
  var items,q=TR.q.trim().toLowerCase();
  if(side==='g'){
    items=Object.keys(S.owned).map(function(id){return {id:id,n:S.owned[id][0]}});
    if(TR.fg==='dup')items=items.filter(function(x){return x.n>1});
  }else{
    var th=parseOwned(SO.fans[TR.uid]?SO.fans[TR.uid].o:'');
    items=Object.keys(th).map(function(id){return {id:id,n:th[id]}});
    if(TR.fw==='new')items=items.filter(function(x){return !S.owned[x.id]});
  }
  items=items.filter(function(x){return BYID[x.id]});
  if(q)items=items.filter(function(x){var c=BYID[x.id];return (c.n+' '+BRANDS[c.b].n).toLowerCase().indexOf(q)>=0});
  items.sort(function(a,b){var A=BYID[a.id],B=BYID[b.id];return B.r-A.r||B.s-A.s});
  return items;
}
function trItemHTML(x,side){
  var c=BYID[x.id],sel=TR[side==='g'?'give':'want'].indexOf(x.id)>=0;
  var tag=side==='g'?(x.n>1?'×'+x.n:''):(S.owned[x.id]?'':'<em class="nw">'+t('Nouveau')+'</em>');
  return '<button class="titem rc'+c.r+'" data-act="tpick" data-side="'+side+'" data-id="'+x.id+'" aria-pressed="'+sel+'"><i class="rd"></i><span style="min-width:0"><b>'+esc(c.n)+'</b><small>'+esc(BRANDS[c.b].n)+' · '+esc(rarName(c.r))+'</small></span><em>'+(side==='g'?tag:tag)+'</em></button>';
}
function renderTradeLists(){
  ['g','w'].forEach(function(side){
    var el=$('#trL'+side);if(!el)return;
    var items=trItems(side),lim=TR['lim'+side],shown=items.slice(0,lim);
    el.innerHTML=shown.length?shown.map(function(x){return trItemHTML(x,side)}).join('')+(items.length>shown.length?'<button class="btn" data-act="tmore" data-side="'+side+'">'+t('Afficher plus')+'</button>':''):'<div class="empty" style="padding:18px 8px">'+(side==='g'&&TR.fg==='dup'?t('Aucun doublon pour le moment.'):t('Aucune carte.'))+'</div>';
  });
  trUpdateSum();
}
function trUpdateSum(){
  var vg=TR.give.reduce(function(a,id){return a+RVAL[BYID[id].r]},0),vw=TR.want.reduce(function(a,id){return a+RVAL[BYID[id].r]},0);

  var b=$('#trSend');if(b)b.disabled=!(TR.give.length&&TR.want.length);
}

  m=document.createElement('div');m.id='tr';m.className='sh';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label',t('Proposer un échange'));
  m.innerHTML='<div class="sh-box" style="max-width:760px"><button class="sh-x" data-act="trx">'+t('Fermer')+'</button><h2>'+t('Échange avec {name}',{name:esc(nameOfUid(uid))})+'</h2><p class="note" style="margin:0 0 12px">'+t('Choisis jusqu\'à 5 cartes de chaque côté. Tes cartes sont mises de côté jusqu\'à la réponse de ton ami, et reviennent si l\'offre est annulée ou refusée.')+'</p>'+

   '<div class="tsum" id="trSum"></div><div id="trMsg"></div><div class="sh-actions"><button class="btn btn-primary" id="trSend" data-act="tsend" disabled>'+t('Envoyer l\'offre')+'</button><button class="btn" data-act="trx">'+t('Annuler')+'</button></div></div>';

var CAT={x:24,busy:false,hushed:false,timer:0,hideT:0,bubT:0,emoT:0,peek:null,peekT:0,queue:null,built:false};
function catHome(){return Math.max(8,window.innerWidth-96)}
function catEl(){return $('#cat')}
function catSvg(){return $('#cat .cat-svg')}
function catEnabled(){return !!(S.set.mascot&&!CAT.hushed&&S.ob>=1&&!document.hidden)}
function catSetEmo(emo){var s=catSvg();if(s)s.setAttribute('data-emo',emo)}
function catBuild(){
  if(CAT.built)return;CAT.built=true;
  var e=document.createElement('div');e.id='cat';e.className='gone';
  e.innerHTML='<div class="cat-move" id="catMove"><div class="speech" id="catSpeech" hidden></div><button class="cat-body" id="catBody" data-act="cat" aria-label="Teapee">'+catSVG({emo:'neutral'})+'</button></div>';
  document.body.appendChild(e);
  CAT.x=catHome();
  var mv=$('#catMove');mv.style.transitionDuration='0ms';mv.style.transform='translateX('+CAT.x+'px)';
  catSync();
}
function catSync(){
  if(!CAT.built)return;
  var h=!!document.querySelector('#ov,#bxov,#qzs,#wl,#tut,#cu,#tr');
  CAT.hushed=h;
  var e=catEl(),off=!S.set.mascot||S.ob<1||h||!!CAT.peek;
  e.classList.toggle('gone',off);
  if(h){clearTimeout(CAT.bubT);var b=$('#catSpeech');if(b)b.hidden=true}
  if(!off&&!CAT.timer)catTick();
  if(off&&!CAT.peek&&!CAT.busy){clearTimeout(CAT.timer);CAT.timer=0}
  if(!h&&CAT.queue&&S.set.mascot){var q=CAT.queue;CAT.queue=null;setTimeout(function(){catSay(q.text,q.emo,q.ms)},500)}
}
function catHush(){setTimeout(catSync,0)}
function catWalkTo(x){
  var dist=Math.abs(x-CAT.x),dur=Math.max(500,dist/58*1000),b=$('#catBody'),mv=$('#catMove'),s=catSvg();
  if(!mv)return 0;
  b.classList.toggle('flip',x<CAT.x);
  if(s)s.classList.add('walk');
  mv.style.transitionDuration=dur+'ms';mv.style.transform='translateX('+x+'px)';
  CAT.x=x;return dur;
}
function catStop(){var s=catSvg();if(s)s.classList.remove('walk')}
function catTick(){
  clearTimeout(CAT.timer);CAT.timer=0;
  if(!catEnabled()||CAT.busy||!S.set.mascot){CAT.timer=setTimeout(catTick,1500);return}
  var r=Math.random(),vw=window.innerWidth;
  if(r<.55){catSetEmo('happy');CAT.timer=setTimeout(function(){if(!CAT.busy)catSetEmo('neutral');catTick()},1800+Math.random()*1500)}
  else if(r<.82){catSetEmo('neutral');CAT.timer=setTimeout(catTick,2500+Math.random()*3000)}
  else if(r<.92){catSetEmo('sleepy');CAT.timer=setTimeout(function(){if(!CAT.busy)catSetEmo('neutral');catTick()},6000+Math.random()*4000)}
  else{catSay(TIPS[rnd(TIPS.length)][LANG==='en'?1:0],'happy',6000);CAT.timer=setTimeout(catTick,7000)}
}
function catPlaceBubble(){
  var b=$('#catSpeech');if(!b||b.hidden)return;
  b.style.setProperty('--sx','-50%');b.style.setProperty('--ax','50%');
  var r=b.getBoundingClientRect(),vw=document.documentElement.clientWidth,sh=0;
  if(r.left<8)sh=8-r.left;else if(r.right>vw-8)sh=(vw-8)-r.right;
  if(sh){b.style.setProperty('--sx','calc(-50% + '+sh+'px)');b.style.setProperty('--ax','calc(50% - '+sh+'px)')}
}
function catSay(text,emo,ms,actions){
  if(!S.set.mascot)return;
  if(CAT.hushed||!catEl()||catEl().classList.contains('gone')){if(text)CAT.queue={text:text,emo:emo,ms:ms};return}
  clearTimeout(CAT.bubT);clearTimeout(CAT.emoT);
  if(emo)catSetEmo(emo);
  var b=$('#catSpeech');
  if(text){
    b.innerHTML='<span>'+esc(text)+'</span>'+(actions?'<div class="sa">'+actions.map(function(a){return '<button data-act="'+a.act+'"'+(a.pr?' class="pr"':'')+'>'+esc(a.l)+'</button>'}).join('')+'</div>':'');
    b.hidden=false;catPlaceBubble();
    CAT.bubT=setTimeout(function(){b.hidden=true;if(!CAT.busy)catSetEmo('neutral')},ms||(actions?9000:4800));
  }else CAT.emoT=setTimeout(function(){if(!CAT.busy)catSetEmo('neutral')},ms||2500);
}
function catReact(emo,text){catSay(text||'',emo,text?4800:2500)}
function catPoke(){
  var b=$('#catSpeech');
  if(b&&!b.hidden&&b.querySelector('.sa')){b.hidden=true;catSetEmo('neutral');return}
  CAT.busy=true;catStop();
  var msgs=[t('Miaou ! Besoin d\'un conseil ?'),t('Prêt pour un petit quiz ?'),t('Un thé, et on discute ?')];
  catSay(Math.random()<.45?TIPS[rnd(TIPS.length)][LANG==='en'?1:0]:pick(msgs),'happy',9000,[{l:t('Quiz'),act:'cat-quiz',pr:1},{l:t('Astuce'),act:'cat-tip'},{l:t('Ok'),act:'cat-bye'}]);
  clearTimeout(CAT.timer);CAT.timer=setTimeout(function(){CAT.busy=false;catTick()},9500);
}
function catTip(){catSay(TIPS[rnd(TIPS.length)][LANG==='en'?1:0],'think',7000,[{l:t('Une autre'),act:'cat-tip'},{l:t('Ok'),act:'cat-bye'}])}
function catBye(){var b=$('#catSpeech');if(b)b.hidden=true;CAT.busy=false;catSetEmo('neutral');clearTimeout(CAT.timer);CAT.timer=setTimeout(catTick,800)}
/* cache-cache */
function scheduleHide(first){clearTimeout(CAT.hideT);var k=hwActive()?.45:1;CAT.hideT=setTimeout(catHide,k*(first?(45000+Math.random()*30000):(80000+Math.random()*100000)))}
function catHide(){
  if(!catEnabled()||CAT.busy||CAT.peek){scheduleHide();return}
  CAT.busy=true;clearTimeout(CAT.timer);CAT.timer=0;
  var vw=window.innerWidth,left=false;
  catSay(t('Cache-cache !'),'excited',1200);
  var d=catWalkTo(left?-80:vw+20);
  setTimeout(function(){
    if(!catEnabled()){CAT.busy=false;catWalkTo(Math.min(vw-100,Math.max(8,vw/2)));return}
    catEl().classList.add('gone');
    var kind=Math.random()<.5?'tail':'ear',p=document.createElement('button');
    p.type='button';p.setAttribute('data-act','peek');p.setAttribute('aria-label',t('Teapee se cache : touche pour le trouver'));
    if(kind==='tail'){p.className='peek '+(left?'tailL':'tailR');p.style.top=(22+Math.random()*50)+'vh';p.innerHTML=peekTailSVG()+'<span class="sp">✨</span>';CAT.peek={kind:'tail',left:left}}
    else{var lx=Math.round(24+Math.random()*(vw-120));p.className='peek ear';p.style.left=lx+'px';p.innerHTML=peekEarSVG()+'<span class="sp">✨</span>';CAT.peek={kind:'ear',x:lx}}
    CAT.peek.el=p;document.body.appendChild(p);
    CAT.peekT=setTimeout(peekGiveUp,26000);
  },d+120);
}
function peekPos(){
  var vw=window.innerWidth,pk=CAT.peek;
  if(pk.kind==='tail')return pk.left?8:Math.max(8,vw-96);
  return Math.max(8,Math.min(vw-96,pk.x-12));
}
function peekClear(){clearTimeout(CAT.peekT);if(CAT.peek&&CAT.peek.el)CAT.peek.el.remove()}
function catReturn(x,emo,text){
  x=catHome();var mv=$('#catMove');mv.style.transitionDuration='0ms';mv.style.transform='translateX('+x+'px)';CAT.x=x;
  var b=$('#catBody');if(b)b.classList.remove('flip');catStop();
  var e=catEl();e.classList.remove('gone');e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop');
  CAT.busy=false;catSay(text,emo,5000);
  clearTimeout(CAT.timer);CAT.timer=setTimeout(catTick,2500);
}
function peekGiveUp(){
  if(!CAT.peek)return;var x=peekPos();peekClear();CAT.peek=null;
  catReturn(x,'happy',t('Hihi ! Tu ne m\'as pas trouvé cette fois.'));
  scheduleHide();
}
function peekFound(ev){
  if(!CAT.peek)return;
  var x=peekPos(),r=CAT.peek.el.getBoundingClientRect(),g=(3+rnd(5))*(hwActive()?2:1);
  peekClear();CAT.peek=null;
  S.leaves+=g;S.stats.found=(S.stats.found||0)+1;touch();

function fxFloat(x,y,text){
  var f=document.createElement('div');f.className='fx-leaf';f.textContent=text;f.style.left=Math.max(8,x-14)+'px';f.style.top=Math.max(8,y)+'px';

var WEBCFG=window.TM_CONFIG||null;

var WEBLS='teamaster.auth';

function webEmail(name){return name.toLowerCase()+'@teamaster-players.com'}
function webNameOk(n){return /^[A-Za-z0-9_.-]{2,20}$/.test(n)}
function webReq(path,opt,authed){
  opt=opt||{};var h={apikey:WEBCFG.supabaseKey,'Content-Type':'application/json'};
  if(authed&&WEB.sess)h.Authorization='Bearer '+WEB.sess.at;
  else if(String(WEBCFG.supabaseKey).indexOf('eyJ')===0)h.Authorization='Bearer '+WEBCFG.supabaseKey;/* les clés « sb_publishable_ » ne sont pas des JWT : apikey seul */
  if(opt.prefer)h.Prefer=opt.prefer;
  return fetch(String(WEBCFG.supabaseUrl).replace(/\/+$/,'')+path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined}).then(function(r){
    return r.text().then(function(tx){var j=null;try{j=tx?JSON.parse(tx):null}catch(e){}if(!r.ok){var e=new Error((j&&(j.msg||j.error_description||j.message))||('HTTP '+r.status));e.status=r.status;e.code=(j&&(j.error_code||j.code))||'';throw e}return j})});
}
function webSetSess(j,name){
  var now=Date.now();
  WEB.sess={at:j.access_token,rt:j.refresh_token,exp:now+((j.expires_in||3600)*1000),uid:j.user&&j.user.id,name:name||(WEB.sess&&WEB.sess.name)||''};webSave();
}
function webRefresh(){
  return webReq('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:WEB.sess.rt}}).then(function(j){webSetSess(j)});
}
function webAuthed(path,opt){
  var p=(WEB.sess.exp-Date.now()<60000)?webRefresh():Promise.resolve();
  return p.then(function(){return webReq(path,opt,true)}).catch(function(e){
    if(e.status===401&&WEB.sess&&!opt._retry){opt._retry=1;return webRefresh().then(function(){return webReq(path,opt,true)})}
    throw e;
  });
}
function webErr(e){
  var m=String((e&&e.message)||'').toLowerCase(),c=String((e&&e.code)||'');
  if(c==='invalid_credentials'||m.indexOf('invalid login')>=0)return t('Pseudo ou mot de passe incorrect.');
  if(c==='user_already_exists'||m.indexOf('already registered')>=0||m.indexOf('already been registered')>=0)return t('Ce pseudo est déjà pris.');
  if(c==='weak_password'||m.indexOf('password should')>=0)return t('Mot de passe trop court : 6 caractères minimum.');
  if(c==='over_request_rate_limit'||c==='over_email_send_rate_limit'||(e&&e.status===429))return t('Trop d\'essais. Réessaie dans quelques minutes.');
  if(e&&e.noSession)return t('Le serveur demande une confirmation par e-mail : désactive « Confirm email » dans Supabase.');
  if(!e||e instanceof TypeError||!e.status)return t('Connexion au serveur impossible. Vérifie ta connexion.');
  return t('Une erreur est survenue. Réessaie dans un instant.')+' ['+e.status+(e.code?' '+e.code:'')+(e.message?' – '+String(e.message).slice(0,160):'')+']';
}
function webAdopt(prefCloud){

function webSign(name,pw,create){

/* Code permanent : un seul secret choisi par le joueur, converti en identifiants du compte */
function webHex(str){
  if(!(window.crypto&&crypto.subtle&&window.TextEncoder))return Promise.reject(new Error('nocrypto'));
  return crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')});
}
function webCodeNorm(c){return String(c||'').replace(/\s+/g,'').toUpperCase()}
function webCodeOk(c){return webCodeNorm(c).replace(/-/g,'').length>=10}
function webCodeGen(){
  var A='ABCDEFGHJKMNPQRSTUVWXYZ23456789',a=new Uint8Array(12),o='';
  (window.crypto&&crypto.getRandomValues)?crypto.getRandomValues(a):a.forEach(function(_,i){a[i]=Math.floor(Math.random()*256)});
  for(var i=0;i<12;i++){o+=A[a[i]%A.length];if(i%4===3&&i<11)o+='-'}
  return o;
}
function webSignCode(code,create){
  var c=webCodeNorm(code);
  return Promise.all([webHex('tm-id|'+c),webHex('tm-pw|'+c)]).then(function(h){
    var email='c'+h[0].slice(0,30)+'@teamaster-players.com',path=create?'/auth/v1/signup':'/auth/v1/token?grant_type=password';
    return webReq(path,{method:'POST',body:{email:email,password:h[1]}});
  }).then(function(j){
    if(!j||!j.access_token){var e=new Error('nosession');e.noSession=true;throw e}
    webSetSess(j,'');return webAdopt(!create);
  });
}

/* ---- Social sur Supabase : même interface que la base partagée de Claude (doc / collection / onSnapshot) ---- */
var WEBSOC={sub:null,hb:null};
function webDocs(rows){return (rows||[]).map(function(r){var d=r.data||{};d._seen=r.seen;return {id:r.user_id,data:function(){return d}}})}
function webRows(q){return webAuthed('/rest/v1/players?select=user_id,data,seen&'+q)}
function webQuery(){
  var q={f:'',lim:''},o={
    where:function(k,op,v){q.f=(op==='array-contains')?('fr=cs.%7B'+encodeURIComponent(v)+'%7D'):(k+'=eq.'+encodeURIComponent(v));return o},
    limit:function(n){q.lim='&limit='+(+n||1);return o},
    get:function(){return webRows(q.f+q.lim).then(function(r){return {docs:webDocs(r)}})},
    onSnapshot:function(ok,err){
      var stopped=false,tm=null;
      function run(){
        if(stopped)return;
        if(document.hidden){tm=setTimeout(run,4000);return}
        webRows(q.f).then(function(r){
          if(stopped)return;
          var on={},now=Date.now();(r||[]).forEach(function(x){var ts=Date.parse(x.seen);if(ts&&now-ts<120000)on[x.user_id]=1});
          SO.online=on;SO.roomOk=true;ok({docs:webDocs(r),metadata:{fromCache:false}});
        },function(e){if(!stopped)err(e)}).then(function(){if(!stopped){clearTimeout(tm);tm=setTimeout(run,7000)}});
      }
      WEBSOC.poke=function(){if(!stopped){clearTimeout(tm);tm=setTimeout(run,1200)}};
      WEBSOC.hb=setInterval(function(){
        if(document.hidden||!WEB.sess||!CL.uid)return;
        webAuthed('/rest/v1/players?user_id=eq.'+encodeURIComponent(CL.uid),{method:'PATCH',prefer:'return=minimal',body:{seen:new Date().toISOString()}}).catch(function(){});
      },40000);
      run();
      return function(){stopped=true;clearTimeout(tm);clearInterval(WEBSOC.hb);WEBSOC.poke=null};
    }
  };
  return o;
}
function webDb(){
  return {
    doc:function(path){
      var uid=String(path).split('/')[1];
      return {
        set:function(d){return webAuthed('/rest/v1/players?on_conflict=user_id',{method:'POST',prefer:'resolution=merge-duplicates,return=minimal',body:{user_id:uid,cd:d.cd,fr:d.fr||[],data:d,seen:new Date().toISOString()}})},
        delete:function(){return webAuthed('/rest/v1/players?user_id=eq.'+encodeURIComponent(uid),{method:'DELETE'})}
      };
    },
    collection:function(){return webQuery()}
  };
}

function webSubmit(form){
